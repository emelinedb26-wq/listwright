<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>octant-ao: per-vertex AO on an octant grid (stairs and slabs)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font:14px system-ui,sans-serif}
#hud{position:fixed;left:12px;top:12px;background:#fffd;padding:10px 12px;border-radius:6px;max-width:420px;line-height:1.4}
canvas{display:block;width:100vw;height:100vh}
button{font:inherit;padding:4px 10px;margin-top:6px}</style></head>
<body><div id="hud"><b>octant-ao</b>: per-vertex ambient occlusion sampled on a grid of octants (2x2x2 per block).
A stair is a slab plus 1, 2 or 3 top octants, so inner and outer corners get their own occlusion.
Row 1: the 5 stair shapes against a wall. Row 2: the same, upside down. Drag to orbit.<br>
<button id="toggle">toggle AO</button> <span id="state"></span></div>
<script src="demo.js"></script></body></html>
